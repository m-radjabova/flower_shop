<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Basic SEO -->
    <title>Flower Marketplace</title>
    <meta
      name="description"
      content="Muslima Boutique is a premium flower marketplace for elegant bouquets, romantic gifts, wedding flowers, birthday arrangements, and trusted local flower shops."
    />
    <meta
      name="keywords"
      content="flower shop, flower marketplace, fresh flowers, bouquets, online florist, flower delivery, romantic flowers, birthday flowers, wedding flowers, roses"
    />
    <meta name="author" content="Flower Marketplace" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#8f111d" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Flower Marketplace" />
    <meta
      property="og:description"
      content="Discover luxury bouquets, romantic floral gifts, and trusted local flower shops in one elegant marketplace."
    />
    <meta property="og:image" content="/for-meta-teg.png" />
    <meta property="og:image:alt" content="Luxury bouquet from Flower Marketplace" />
    <meta property="og:site_name" content="Flower Marketplace" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Flower Marketplace | Premium Flower Marketplace" />
    <meta
      name="twitter:description"
      content="Order premium bouquets, fresh flowers, and elegant floral gifts from trusted local shops."
    />
    <meta name="twitter:image" content="/for-meta-teg.png" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/flower_icon.png" />
    <link rel="apple-touch-icon" href="/cherryblossom.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- App -->
    <meta name="application-name" content="Flower Marketplace" />
    <meta name="apple-mobile-web-app-title" content="Flower Marketplace" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Security / UX -->
    <meta name="format-detection" content="telephone=no" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "name": "Flower Marketplace",
        "description": "Premium online flower marketplace for fresh bouquets, romantic gifts, and trusted local florists.",
        "image": "/for-meta-teg.png"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
